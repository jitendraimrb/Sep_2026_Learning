server:
  port: 8081

spring:
  application:
    name: service1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:
  circuitbreaker:
    instances:
      service2CB:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10

  retry:
    instances:
      service2CB:
        max-attempts: 3
        wait-duration: 2s

  timelimiter:
    instances:
      service2CB:
        timeout-duration: 2s

# -------------------------------
# OpenTelemetry Configuration
# -------------------------------
otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317   # OTLP Collector endpoint

opentelemetry:
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  logs:
    exporter: otlp

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"
