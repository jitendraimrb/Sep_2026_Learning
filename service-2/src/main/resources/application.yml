server:
  port: 8082

spring:
  application:
    name: service2

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# -------------------------------
# OpenTelemetry Configuration
# -------------------------------
otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317   # OTLP Collector endpoint

opentelemetry:
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  logs:
    exporter: otlp

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"
